; Walk the Archive - DefaultDeviceProfiles.ini
; Layers over Engine/Config/BaseDeviceProfiles.ini (UE 5.8). Section names and the +CVars
; syntax match the 5.8 base file ([Windows DeviceProfile], [Mac DeviceProfile]).
; Comments sit on their own lines; Unreal does not support trailing comments.

[Windows DeviceProfile]
DeviceType=Windows
BaseProfileName=
; Windows keeps the project defaults: Lumen HWRT, MegaLights, Nanite, VSM, Substrate Adaptive.

[Mac DeviceProfile]
DeviceType=Mac
BaseProfileName=
; Apple Silicon: Lumen hardware ray tracing and MegaLights are Experimental (M2+) in 5.8 and
; absent on M1, so the first run uses software Lumen (mesh distance fields) and deferred
; lighting with Virtual Shadow Maps. Both cvars are verified in engine source
; (docs/reference/render.md sections 3.1 and 6). On an M2 or newer Mac that renders cleanly,
; delete the two lines below to try the experimental path.
+CVars=r.Lumen.HardwareRayTracing=0
+CVars=r.MegaLights.Allowed=0
