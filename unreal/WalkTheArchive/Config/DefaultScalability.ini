; Walk the Archive - DefaultScalability.ini
; Layers over Engine/Config/BaseScalability.ini (UE 5.8). Only overrides that
; docs/reference/render.md section 13 verified against the 5.8 base file are here.
; Levels: 0 Low, 1 Medium (Lumen Lite), 2 High, 3 Epic (the PC default), Cine.
; Comments sit on their own lines; Unreal does not support trailing comments.
;
; Considered and left at the engine default:
; - [GlobalIlluminationQuality@2] r.Lumen.HardwareRayTracing.HitLighting.Allowed=0 is already
;   what 5.8 ships, so hit lighting only appears at Epic and above.
; - [ShadowQuality@3] r.Shadow.Virtual.MaxPhysicalPages=8192 would help 12 GB+ cards but
;   overflows 8 GB cards, which the FULL preflight verdict still allows. Raise it per machine.

[GlobalIlluminationQuality@Cine]
; Full Hit Lighting (GI + reflections) for Movie Render Graph stills only; too costly for play.
r.Lumen.HardwareRayTracing.LightingMode=1
