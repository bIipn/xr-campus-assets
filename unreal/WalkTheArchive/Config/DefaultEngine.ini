; Walk the Archive - DefaultEngine.ini (Unreal Engine 5.8)
; Every comment sits on its own line. Unreal's ini reader does not support trailing
; comments, so "key=value ; note" would corrupt the value. Keep it that way.
; Renderer keys come from docs/reference/render.md section 14 (verified against
; RendererSettings.h and shipped project inis). Toggling Substrate, Nanite, hardware
; ray tracing or SM6 needs an editor restart and a full shader recompile.

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/WTA/Maps/L_Campus.L_Campus
EditorStartupMap=/Game/WTA/Maps/L_Campus.L_Campus
GlobalDefaultGameMode=/Script/WalkTheArchive.WTAGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.Engine]
; Nothing exotic: engine defaults. The section is here so a future redirect has a home.

[/Script/Engine.InputSettings]
; UInputSettings is a config=Input class, so the copy in DefaultInput.ini is the one the
; engine reads. This copy is kept for readers who look here first.
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent

[/Script/Engine.RendererSettings]
; ---- GI / reflections (Lumen) ----
; Dynamic Global Illumination Method = Lumen (0 None, 1 Lumen, 2 SSGI, 3 Plugin)
r.DynamicGlobalIlluminationMethod=1
; Reflection Method = Lumen (0 None, 1 Lumen, 2 SSR)
r.ReflectionMethod=1
; CHOICE: Use Hardware Ray Tracing when available. Falls back to software ray tracing
; (mesh distance fields) on GPUs without ray tracing. The Mac device profile turns this
; off at runtime (DefaultDeviceProfiles.ini) because Metal HWRT is Experimental in 5.8.
r.Lumen.HardwareRayTracing=True
; CHOICE: Ray Lighting Mode = 2 (Hit Lighting for Reflections). 0 = Surface Cache (fastest),
; 1 = Hit Lighting for GI and reflections (very costly). Scalability gates it further:
; r.Lumen.HardwareRayTracing.HitLighting.Allowed is 0 below Epic GI quality.
r.Lumen.HardwareRayTracing.LightingMode=2
; Software Ray Tracing Mode = Detail Tracing (per-mesh SDF) when SWRT is used
r.Lumen.TraceMeshSDFs=1
; High Quality Translucency Reflections (glass cases, windows)
r.Lumen.TranslucencyReflections.FrontLayer.EnableForProject=True
; Ray Traced Translucent Refractions (HWRT only)
r.Lumen.Reflections.HardwareRayTracing.Translucent.Refraction.EnableForProject=True
; Screen Tracing Source = anti-aliased scene color with translucency (less emissive noise)
r.Lumen.ScreenTracingSource=1
; Generate Mesh Distance Fields (required for the SWRT fallback and DFAO)
r.GenerateMeshDistanceFields=True
; Distance field voxel density (engine default; raise for small props)
r.DistanceFields.DefaultVoxelDensity=0.2
; ---- Hardware ray tracing / path tracer ----
; CHOICE: Support Hardware Ray Tracing (DX12 SM6 / Vulkan SM6 / Metal SM6). Needed by
; Lumen HWRT, MegaLights and the Path Tracer. Shipping SM6 only means no DX11 fallback.
r.RayTracing=True
; Generate Ray Tracing Proxies (5.7+; simplified RT geometry for Nanite meshes)
r.RayTracing.RayTracingProxies.ProjectEnabled=True
; Legacy Ray Traced Shadows off (VSM + MegaLights handle shadows)
r.RayTracing.Shadows=False
; Support Compute Skin Cache (required by HWRT for skinned NPCs)
r.SkinCache.CompileShaders=True
; Path Tracing (reference stills; needs r.RayTracing)
r.PathTracing=True
; ---- Direct lighting / shadows ----
; CHOICE: MegaLights on (Production Ready in 5.8). Dozens of shadowed gallery lights for one
; fixed cost. Gated per device by r.MegaLights.Allowed (off in the Mac device profile).
r.MegaLights.EnableForProject=True
; Shadow Map Method = Virtual Shadow Maps (0 Shadow Maps, 1 VSM)
r.Shadow.Virtual.Enable=1
; ---- Geometry ----
; Nanite for all static architecture, furniture, books and exhibits
r.Nanite.ProjectEnabled=True
; Allow Nanite tessellation (displacement; experimental, optional)
r.Nanite.AllowTessellation=1
; Enable Nanite tessellation at runtime (optional; pair with the line above)
r.Nanite.Tessellation=1
; ---- Materials ----
; Substrate materials (production since 5.7; new projects default on)
r.Substrate=1
; Substrate GBuffer Format: 0 Blendable (default, cheaper), 1 Adaptive (layers/topology, PC
; high-end). Config/Mac/MacEngine.ini sets it back to 0 for Mac builds.
r.Substrate.ProjectGBufferFormat=1
; Enable Rough Diffuse Material (energy-correct rough dielectrics)
r.Material.RoughDiffuse=True
; Enable Energy Conservation on Material
r.Material.EnergyConservation=True
; ---- Anti-aliasing / upscaling ----
; Anti-Aliasing Method = TSR (0 None, 1 FXAA, 2 TAA, 3 MSAA, 4 TSR)
r.AntiAliasingMethod=4
; Temporal Upsampling (TSR upscales from r.ScreenPercentage)
r.TemporalAA.Upsampling=True
; ---- Exposure / post defaults ----
; Auto Exposure on by default
r.DefaultFeature.AutoExposure=True
; Auto Exposure method: 0 Histogram, 1 Basic, 2 Manual
r.DefaultFeature.AutoExposure.Method=0
; Auto Exposure Bias (exposure compensation, EV)
r.DefaultFeature.AutoExposure.Bias=0.0
; Min/Max Brightness become Min/Max EV100 (physical light units)
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
; Local Exposure Highlight Contrast (1.0 = off); windows vs interiors
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
; Local Exposure Shadow Contrast (1.0 = off)
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8
; Light Units: 0 Unitless, 1 Candelas, 2 Lumens, 3 EV, 4 Nits
r.DefaultFeature.LightUnits=1
; Bloom
r.DefaultFeature.Bloom=True
; SSAO default (Lumen provides most AO; keep for non-Lumen levels)
r.DefaultFeature.AmbientOcclusion=True
; Motion Blur off for a walkable archive (enable per post process volume for cinematics)
r.DefaultFeature.MotionBlur=False
; Image-based lens flares off
r.DefaultFeature.LensFlare=False
; ---- Virtual texturing ----
; Enable virtual texture support (streaming VT for 4K/8K PBR sets)
r.VirtualTextures=True
; Enable virtual texture on texture import
r.VT.EnableAutoImport=True
; VT tile size (power of two; restart)
r.VT.TileSize=128
; VT tile border size
r.VT.TileBorderSize=4
; VT anisotropic filtering
r.VT.AnisotropicFiltering=True
; No VT lightmaps (fully dynamic lighting)
r.VirtualTexturedLightmaps=False
; ---- Sky / fog / volumetrics ----
; Support Sky Atmosphere
r.SupportSkyAtmosphere=True
; Sky Atmosphere affects height fog
r.SupportSkyAtmosphereAffectsHeightFog=True
; Support Local Fog Volumes (per-room haze)
r.SupportLocalFogVolumes=True
; Heterogeneous Volumes (Experimental) for VDB smoke/dust (optional)
r.HeterogeneousVolumes=1
; Heterogeneous volume shadow casting (optional)
r.HeterogeneousVolumes.Shadows=1
; ---- Lighting pipeline ----
; Fully dynamic (Lumen); drops static-lighting shader permutations. "Build Lighting" does
; not apply to this project.
r.AllowStaticLighting=False
; Custom Depth-Stencil Pass = Enabled with Stencil (outline/highlight FX)
r.CustomDepth=3

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Default RHI = DirectX 12
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
; D3D12 SM6 only (Nanite/VSM/HWRT/MegaLights need SM6)
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
; No DX11 fallback shaders
-D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/MacTargetPlatform.MacTargetSettings]
; Metal SM6 (Apple Silicon; M2+ for Nanite/VSM)
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
; Vulkan SM6
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/PythonScriptPlugin.PythonScriptPluginSettings]
; Developer Mode writes the API stub Intermediate/PythonStub/unreal.py on editor start
; (grep it to confirm names before scripting) and turns on deprecation warnings.
; Content/Python is already on the Python path, so no AdditionalPaths are needed.
bDeveloperMode=True

[/Script/NavigationSystem.RecastNavMesh]
; The nav mesh is built in the editor (setup_project.py step "navmesh") and saved with the
; level; nothing moves at runtime, so static generation is enough. Static is also the
; engine default; it is written here to record the decision.
RuntimeGeneration=Static
