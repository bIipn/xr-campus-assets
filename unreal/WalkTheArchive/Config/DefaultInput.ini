; Walk the Archive - DefaultInput.ini
; Enhanced Input only. Actions and mapping contexts are built in C++ by AWTAPlayerController
; (contract section 4.3), so there are no legacy ActionMappings or AxisMappings here.
; Comments sit on their own lines; Unreal does not support trailing comments.

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; First-person game: grab the mouse as soon as the window has focus.
bCaptureMouseOnLaunch=True
DefaultViewportMouseCaptureMode=CapturePermanently_IncludingInitialMouseDown
DefaultViewportMouseLockMode=LockOnCapture
