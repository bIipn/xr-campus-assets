[/Script/WalkTheArchive.WTASettings]
CampusTitle=Walk the Archive
ClientName=XR Libraries
; One soft reference per data table, named after the table without DT_ (contract section 4.2).
; The tables are created by Scripts/setup_project.py (step data_tables) from Data/*.json.
Exhibits=/Game/WTA/Data/DT_Exhibits.DT_Exhibits
Books=/Game/WTA/Data/DT_Books.DT_Books
Sources=/Game/WTA/Data/DT_Sources.DT_Sources
Galleries=/Game/WTA/Data/DT_Galleries.DT_Galleries
Subjects=/Game/WTA/Data/DT_Subjects.DT_Subjects
Rooms=/Game/WTA/Data/DT_Rooms.DT_Rooms
Places=/Game/WTA/Data/DT_Places.DT_Places
Tour=/Game/WTA/Data/DT_Tour.DT_Tour
Staff=/Game/WTA/Data/DT_Staff.DT_Staff
StaffRules=/Game/WTA/Data/DT_StaffRules.DT_StaffRules
Facts=/Game/WTA/Data/DT_Facts.DT_Facts
Lessons=/Game/WTA/Data/DT_Lessons.DT_Lessons
Badges=/Game/WTA/Data/DT_Badges.DT_Badges
Tokens=/Game/WTA/Data/DT_Tokens.DT_Tokens
WaxScenes=/Game/WTA/Data/DT_WaxScenes.DT_WaxScenes
Stations=/Game/WTA/Data/DT_Stations.DT_Stations
Rides=/Game/WTA/Data/DT_Rides.DT_Rides
Talks=/Game/WTA/Data/DT_Talks.DT_Talks
; The start: on the forecourt path facing the portico (eye position in cm, UE axes). Set Y=-70, Z=162 for the old lobby start.
SpawnView=(Location=(X=0.000000,Y=2400.000000,Z=87.000000),Yaw=-90.000000,Pitch=4.584000,bValid=True)

[/Script/UnrealEd.ProjectPackagingSettings]
BuildConfiguration=PPBC_Development
bUseIoStore=True
+MapsToCook=(FilePath="/Game/WTA/Maps/L_Campus")
; The data tables are only referenced from config (WTASettings), which the cooker does not
; follow, so cook the Data and Art folders unconditionally.
+DirectoriesToAlwaysCook=(Path="/Game/WTA/Data")
+DirectoriesToAlwaysCook=(Path="/Game/WTA/Art")
; The slides are referenced from DT_Talks rows (soft), the narration is found by name at run time.
+DirectoriesToAlwaysCook=(Path="/Game/WTA/Slides")
+DirectoriesToAlwaysCook=(Path="/Game/WTA/Audio")
; The UI's own font files (WTAUIStyle.cpp loads them from <project>/Fonts).
+DirectoriesToAlwaysStageAsNonUFS=(Path="Fonts")

[/Script/Engine.AssetManagerSettings]
; UE 5.8's GameFeaturesToolset plugin (enabled in the .uproject) needs the asset manager to know the
; GameFeatureData type, or the editor opens with a Load Errors window. Game feature data lives in plugins and is
; registered by the GameFeatures subsystem, so the scan points at an empty folder (as Epic's Lyra does).
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))
