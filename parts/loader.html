<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d1613">
<meta name="description" content="An unofficial concept by Ev Holt (Walk the Archive): a walkable 3D campus about XR in libraries, with a museum, a library, a workshop school and a recess yard. Not an official XRLibraries site.">
<meta property="og:title" content="XRLibraries Campus · an unofficial concept by Ev Holt">
<meta property="og:description" content="Walk a 3D museum, library, workshop school and recess yard right in your browser. Not an official XRLibraries site.">
<title>XRLibraries Campus · Unofficial concept by Ev Holt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Libre+Franklin:wght@400;500;600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<style id="bootcss">
html,body{margin:0;height:100%;background:#0d1613}
#boot{position:fixed;inset:0;display:grid;place-items:center;padding:24px;color:#efe7d5;font:15px/1.5 "Libre Franklin","Helvetica Neue",Arial,sans-serif;text-align:center}
#boot small{display:block;color:#cda961;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
#boot h1{margin:10px 0 6px;font:700 32px/1.15 "Old Standard TT",Georgia,serif}
#boot p{margin:0;color:#a9b8ae}
#boot .bar{width:180px;height:3px;margin:20px auto 0;background:#1f312b;border-radius:3px;overflow:hidden}
#boot .bar i{display:block;width:6%;height:100%;background:#cda961;transition:width .3s ease}
</style>
</head>
<body>
<div id="boot" role="status" aria-live="polite"><div><small>A concept by Ev Holt · Walk the Archive</small><h1>XRLibraries Campus</h1><p id="bootMsg">Loading the campus…</p><div class="bar" id="bootTrack"><i id="bootBar"></i></div></div></div>
<script>
window.__boot = (() => {
  const C = [/*CHUNKS*/], bar = document.getElementById('bootBar');
  let n = 0;
  const p = !('DecompressionStream' in window) ? Promise.reject(new Error('old'))
    : Promise.all(C.map((u) => fetch(u).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
      .then((b) => { bar.style.width = (6 + 94 * ++n / C.length) + '%'; return b; })));
  p.catch(() => {});
  return p;
})();
</script>
<!--IMPORTMAP-->
<script>
(async () => {
  const stop = (t) => { document.getElementById('bootMsg').textContent = t; document.getElementById('bootTrack').hidden = true; };
  let text;
  try {
    const parts = await window.__boot;
    text = await new Response(new Blob(parts).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  } catch (e) {
    return stop(e && e.message === 'old' ? 'This browser is too old to open the campus. Try the latest Chrome, Safari, Edge or Firefox.' : 'The campus didn’t load. Check your connection, then refresh.');
  }
  const [css, body, js] = text.split('\u0001');
  const st = document.createElement('style');
  st.textContent = css;
  document.head.appendChild(st);
  document.getElementById('bootcss').remove();
  delete window.__boot;
  document.body.innerHTML = body;
  const s = document.createElement('script');
  s.type = 'module';
  s.textContent = js;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
